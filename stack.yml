version: '3.8'
services:
  api:
    image: ${DSS_DWH_IMAGE:?Set DSS_DWH_IMAGE}
    environment:
      ORACLE_USER: ${ORACLE_USER:?Set ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      ORACLE_DSN: ${ORACLE_DSN:?Set ORACLE_DSN}
    ports:
      - '8000:8000'
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 45s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
